name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:

  # Turbo Remote Cache (Optional: only needed if using Vercel Remote Caching)
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN || '' }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM || '' }}
  # Default DB credentials for CI (safe for ephemeral containers)
  CI_DB_USER: arena
  CI_DB_PASSWORD: arena123
  CI_DB_NAME: arena_of_100

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install pnpm
        uses: pnpm/action-setup@ac6db6d3c1f721f886538a378a2d73e85697340a
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for Prisma Cache
        id: prisma-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            node_modules/.prisma
            apps/api/node_modules/.prisma
          key: prisma-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'apps/api/prisma/schema.prisma') }}

      - name: Generate Prisma Client
        if: steps.prisma-cache.outputs.cache-hit != 'true'
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://${{ env.CI_DB_USER }}:${{ env.CI_DB_PASSWORD }}@localhost:5432/${{ env.CI_DB_NAME }}

      - name: Save Prisma Cache
        if: steps.prisma-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            node_modules/.prisma
            apps/api/node_modules/.prisma
          key: prisma-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'apps/api/prisma/schema.prisma') }}

  lint:
    needs: install
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install pnpm
        uses: pnpm/action-setup@ac6db6d3c1f721f886538a378a2d73e85697340a
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Prisma Client
        id: prisma-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            node_modules/.prisma
            apps/api/node_modules/.prisma
          key: prisma-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'apps/api/prisma/schema.prisma') }}

      - name: Fallback Generate Prisma
        if: steps.prisma-cache.outputs.cache-hit != 'true'
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://${{ env.CI_DB_USER }}:${{ env.CI_DB_PASSWORD }}@localhost:5432/${{ env.CI_DB_NAME }}

      - name: Run Lint
        run: pnpm lint

  test:
    needs: install
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ env.CI_DB_USER }}
          POSTGRES_PASSWORD: ${{ env.CI_DB_PASSWORD }}
          POSTGRES_DB: ${{ env.CI_DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install pnpm
        uses: pnpm/action-setup@ac6db6d3c1f721f886538a378a2d73e85697340a
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Prisma Client
        id: prisma-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            node_modules/.prisma
            apps/api/node_modules/.prisma
          key: prisma-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'apps/api/prisma/schema.prisma') }}

      - name: Fallback Generate Prisma
        if: steps.prisma-cache.outputs.cache-hit != 'true'
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://${{ env.CI_DB_USER }}:${{ env.CI_DB_PASSWORD }}@localhost:5432/${{ env.CI_DB_NAME }}

      - name: Run Tests with Coverage
        run: pnpm turbo run test:coverage
        env:
          DATABASE_URL: postgresql://${{ env.CI_DB_USER }}:${{ env.CI_DB_PASSWORD }}@localhost:5432/${{ env.CI_DB_NAME }}
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-test-secret-key' }}
          NODE_ENV: test

      - name: Upload Coverage
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            apps/api/coverage/lcov.info
            packages/game-core/coverage/lcov.info
          fail_ci_if_error: true
          skip_validation: true

  e2e:
    needs: install
    runs-on: ubuntu-latest
    env:
      CI_DB_E2E_USER: arena_test
      CI_DB_E2E_PASSWORD: arena_test
      CI_DB_E2E_NAME: arena_test
    strategy:
      matrix:
        node-version: [20, 22]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arena_test
          POSTGRES_PASSWORD: arena_test
          POSTGRES_DB: arena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install pnpm
        uses: pnpm/action-setup@ac6db6d3c1f721f886538a378a2d73e85697340a
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Prisma Client
        id: prisma-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            node_modules/.prisma
            apps/api/node_modules/.prisma
          key: prisma-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'apps/api/prisma/schema.prisma') }}

      - name: Fallback Generate Prisma
        if: steps.prisma-cache.outputs.cache-hit != 'true'
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://${{ env.CI_DB_E2E_USER }}:${{ env.CI_DB_E2E_PASSWORD }}@localhost:5432/${{ env.CI_DB_E2E_NAME }}

      - name: Push Prisma schema to test DB
        run: pnpm --filter @arena/api exec prisma db push
        env:
          DATABASE_URL: postgresql://${{ env.CI_DB_E2E_USER }}:${{ env.CI_DB_E2E_PASSWORD }}@localhost:5432/${{ env.CI_DB_E2E_NAME }}

      - name: Seed questions (dev dataset)
        run: pnpm --filter @arena/api prisma:seed:dev
        env:
          DATABASE_URL: postgresql://${{ env.CI_DB_E2E_USER }}:${{ env.CI_DB_E2E_PASSWORD }}@localhost:5432/${{ env.CI_DB_E2E_NAME }}

      - name: Seed demo users + matches
        run: pnpm --filter @arena/api prisma:seed:demo:unsafe
        env:
          DATABASE_URL: postgresql://${{ env.CI_DB_E2E_USER }}:${{ env.CI_DB_E2E_PASSWORD }}@localhost:5432/${{ env.CI_DB_E2E_NAME }}

      - name: Run E2E tests
        # Bypass the workspace `test:e2e` script because it hardcodes
        # DATABASE_URL via cross-env, which would override the CI
        # step-level env. We call vitest directly so the URL and
        # Redis DB index configured above are honored.
        run: pnpm --filter @arena/api exec vitest run --config test/vitest-e2e.config.ts
        env:
          DATABASE_URL: postgresql://${{ env.CI_DB_E2E_USER }}:${{ env.CI_DB_E2E_PASSWORD }}@localhost:5432/${{ env.CI_DB_E2E_NAME }}
          REDIS_URL: redis://localhost:6379/1
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-test-secret-key' }}

      - name: Publish E2E summary
        if: always()
        run: |
          node <<'EOF'
          const fs = require('node:fs')
          const reportPath = 'apps/api/test-results/e2e-report.json'
          const summaryPath = process.env.GITHUB_STEP_SUMMARY

          if (!summaryPath || !fs.existsSync(reportPath)) {
            process.exit(0)
          }

          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'))
          const startedAt = typeof report.startTime === 'number'
            ? new Date(report.startTime).toISOString()
            : 'n/a'

          const lines = [
            '## E2E Test Summary',
            '',
            `- Node: ${process.env.NODE_VERSION ?? 'unknown'}`,
            `- Success: ${report.success ? '✅ yes' : '❌ no'}`,
            `- Test suites: ${report.numPassedTestSuites ?? 0}/${report.numTotalTestSuites ?? 0} passed`,
            `- Tests: ${report.numPassedTests ?? 0}/${report.numTotalTests ?? 0} passed`,
            `- Failed: ${report.numFailedTests ?? 0}`,
            `- Pending: ${report.numPendingTests ?? 0}`,
            `- Todo: ${report.numTodoTests ?? 0}`,
            `- Started: ${startedAt}`,
          ]

          const failedSuites = Array.isArray(report.testResults)
            ? report.testResults.filter((suite) => suite.status === 'failed')
            : []

          if (failedSuites.length > 0) {
            lines.push('', '### Failed suites')
            for (const suite of failedSuites.slice(0, 10)) {
              lines.push(`- ${suite.name}`)
            }
          }

          fs.appendFileSync(summaryPath, `${lines.join('\n')}\n`)
          EOF
        env:
          NODE_VERSION: ${{ matrix.node-version }}

      - name: Upload E2E reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-reports-node-${{ matrix.node-version }}
          path: apps/api/test-results
          if-no-files-found: ignore

  build:
    needs: install
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install pnpm
        uses: pnpm/action-setup@ac6db6d3c1f721f886538a378a2d73e85697340a
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Prisma Client
        id: prisma-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            node_modules/.prisma
            apps/api/node_modules/.prisma
          key: prisma-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'apps/api/prisma/schema.prisma') }}

      - name: Fallback Generate Prisma
        if: steps.prisma-cache.outputs.cache-hit != 'true'
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://${{ env.CI_DB_USER }}:${{ env.CI_DB_PASSWORD }}@localhost:5432/${{ env.CI_DB_NAME }}

      - name: Build
        run: pnpm build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-artifacts
          path: |
            apps/api/dist
            apps/web/.next
            !apps/web/.next/cache
