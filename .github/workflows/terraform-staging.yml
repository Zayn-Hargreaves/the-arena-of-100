name: Terraform staging

on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-staging.yml"
  push:
    branches: [main]
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-staging.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "plan or apply"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_WORKING_DIR: infrastructure/terraform/envs/staging
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    # Always schedule on matching events; steps no-op without AWS_ROLE_ARN
    # so forks/contributors without AWS stay green.
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Check AWS configured
        id: gate
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "AWS_ROLE_ARN not configured — skipping Terraform plan."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        if: steps.gate.outputs.skip != 'true'
        with:
          terraform_version: "1.5.7"

      - name: Terraform init
        if: steps.gate.outputs.skip != 'true'
        run: terraform init -input=false

      - name: Terraform fmt
        if: steps.gate.outputs.skip != 'true'
        run: terraform fmt -check -recursive ../..
        continue-on-error: true

      - name: Terraform validate
        if: steps.gate.outputs.skip != 'true'
        run: terraform validate

      - name: Terraform plan
        if: steps.gate.outputs.skip != 'true'
        run: terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt
        env:
          TF_VAR_github_org: ${{ vars.TF_GITHUB_ORG || github.repository_owner }}
          TF_VAR_github_repo: ${{ vars.TF_GITHUB_REPO || github.event.repository.name }}
          TF_VAR_jwt_secret: ${{ secrets.TF_JWT_SECRET || 'ci-plan-placeholder-not-for-apply-32chars' }}
          TF_VAR_cors_origin: ${{ vars.TF_CORS_ORIGIN || 'http://localhost:3000' }}

      - name: PR plan comment
        if: steps.gate.outputs.skip != 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '${{ env.TF_WORKING_DIR }}/plan.txt';
            let body = '## Terraform plan (staging)\n\n```\n';
            try {
              const txt = fs.readFileSync(path, 'utf8');
              body += txt.length > 60000 ? txt.slice(0, 60000) + '\n…truncated…' : txt;
            } catch (e) {
              body += 'No plan output.';
            }
            body += '\n```';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: [plan]
    if: >
      always() &&
      needs.plan.result != 'failure' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.action == 'apply') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    environment: staging
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Check AWS + secrets
        id: gate
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
          JWT: ${{ secrets.TF_JWT_SECRET }}
        run: |
          if [ -z "$ROLE" ] || [ -z "$JWT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Missing AWS_ROLE_ARN or TF_JWT_SECRET — skip apply."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        if: steps.gate.outputs.skip != 'true'
        with:
          terraform_version: "1.5.7"

      - name: Terraform init
        if: steps.gate.outputs.skip != 'true'
        run: terraform init -input=false

      - name: Terraform apply
        if: steps.gate.outputs.skip != 'true'
        run: terraform apply -input=false -auto-approve
        env:
          TF_VAR_github_org: ${{ vars.TF_GITHUB_ORG || github.repository_owner }}
          TF_VAR_github_repo: ${{ vars.TF_GITHUB_REPO || github.event.repository.name }}
          TF_VAR_jwt_secret: ${{ secrets.TF_JWT_SECRET }}
          TF_VAR_cors_origin: ${{ vars.TF_CORS_ORIGIN || 'http://localhost:3000' }}
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
