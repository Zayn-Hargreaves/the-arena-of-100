name: Terraform staging

on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-staging.yml"
  push:
    branches: [main]
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-staging.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "plan or apply"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply

permissions:
  id-token: write
  contents: read
  actions: read
  pull-requests: write

env:
  TF_WORKING_DIR: infrastructure/terraform/envs/staging
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    # Always schedule on matching events; steps no-op without AWS_ROLE_ARN_PLAN
    # so forks/contributors without AWS stay green.
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Check AWS configured
        id: gate
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN_PLAN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
        run: |
          # Plan OIDC is main-only (push / workflow_dispatch on main). Never emit a
          # usable plan role for pull_request or other refs — even if ROLE is set.
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Terraform plan OIDC is main-only — skipping plan on this ref/event."
          elif [ -z "$ROLE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "AWS_ROLE_ARN_PLAN not configured — skipping Terraform plan."
          elif [ -z "$TF_STATE_BUCKET" ] || [ -z "$TF_LOCK_TABLE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "TF_STATE_BUCKET / TF_LOCK_TABLE not configured — skipping Terraform plan."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "role=$ROLE" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        if: steps.gate.outputs.skip != 'true'

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        if: steps.gate.outputs.skip != 'true'
        with:
          role-to-assume: ${{ steps.gate.outputs.role }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        if: steps.gate.outputs.skip != 'true'
        with:
          terraform_version: "1.5.7"
          # Native exit codes required so plan|tee pipefail fails the job
          terraform_wrapper: false

      - name: Terraform init
        if: steps.gate.outputs.skip != 'true'
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"

      - name: Terraform fmt
        if: steps.gate.outputs.skip != 'true'
        run: terraform fmt -check -recursive ../..
        continue-on-error: true

      - name: Terraform validate
        if: steps.gate.outputs.skip != 'true'
        run: terraform validate

      - name: Terraform plan
        if: steps.gate.outputs.skip != 'true'
        # pipefail: preserve terraform plan exit status when teeing to plan.txt
        # Real secrets only on refs/heads/main (push or workflow_dispatch).
        # PR and non-main workflow_dispatch use placeholders (fork/supply-chain risk).
        # Placeholders satisfy var validation (redis: 16–128, charset, 3-of-4 classes).
        # Plan OIDC is main-only; PR plans skip unless ROLE is usable (usually skip).
        run: |
          set -euo pipefail
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt
        env:
          TF_VAR_github_org: ${{ vars.TF_GITHUB_ORG || github.repository_owner }}
          TF_VAR_github_repo: ${{ vars.TF_GITHUB_REPO || github.event.repository.name }}
          TF_VAR_jwt_secret: ${{ secrets.TF_JWT_SECRET || 'ci-plan-placeholder-not-for-apply-32chars' }}
          TF_VAR_cors_origin: ${{ vars.TF_CORS_ORIGIN || 'https://localhost:3000' }}
          TF_VAR_enable_https: ${{ vars.TF_ENABLE_HTTPS || 'true' }}
          TF_VAR_certificate_arn: ${{ vars.TF_CERTIFICATE_ARN || 'arn:aws:acm:ap-southeast-1:000000000000:certificate/ci-plan-placeholder' }}
          TF_VAR_domain_name: ${{ vars.TF_DOMAIN_NAME || 'api.example.com' }}
          TF_VAR_redis_auth_token: ${{ github.ref == 'refs/heads/main' && secrets.TF_REDIS_AUTH_TOKEN || 'CiPlanPlaceholderRd1!' }}
          TF_VAR_tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_tf_lock_table: ${{ vars.TF_LOCK_TABLE }}

      - name: PR plan comment
        if: steps.gate.outputs.skip != 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const path = '${{ env.TF_WORKING_DIR }}/plan.txt';
            let body = '## Terraform plan (staging)\n\n```\n';
            try {
              const txt = fs.readFileSync(path, 'utf8');
              body += txt.length > 60000 ? txt.slice(0, 60000) + '\n…truncated…' : txt;
            } catch (e) {
              body += 'No plan output.';
            }
            body += '\n```';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: [plan]
    if: >
      always() &&
      needs.plan.result != 'failure' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.action == 'apply') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    # Deploy role trust is environment:staging only — protect with required reviewers + main.
    environment: staging
    concurrency:
      group: staging-mutations
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Check AWS + secrets
        id: gate
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
          JWT: ${{ secrets.TF_JWT_SECRET }}
          REDIS_AUTH: ${{ secrets.TF_REDIS_AUTH_TOKEN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
          TF_ENABLE_HTTPS: ${{ vars.TF_ENABLE_HTTPS || 'true' }}
          TF_CERTIFICATE_ARN: ${{ vars.TF_CERTIFICATE_ARN }}
          TF_DOMAIN_NAME: ${{ vars.TF_DOMAIN_NAME }}
        run: |
          missing=()
          [ -z "$ROLE" ] && missing+=("AWS_ROLE_ARN")
          [ -z "$JWT" ] && missing+=("TF_JWT_SECRET")
          [ -z "$REDIS_AUTH" ] && missing+=("TF_REDIS_AUTH_TOKEN")
          [ -z "$TF_STATE_BUCKET" ] && missing+=("TF_STATE_BUCKET")
          [ -z "$TF_LOCK_TABLE" ] && missing+=("TF_LOCK_TABLE")

          # Normalize enable_https (default true)
          case "$(echo "$TF_ENABLE_HTTPS" | tr '[:upper:]' '[:lower:]')" in
            true|1|yes) HTTPS_ON=true ;;
            *) HTTPS_ON=false ;;
          esac

          if [ "$HTTPS_ON" = true ]; then
            [ -z "$TF_CERTIFICATE_ARN" ] && missing+=("TF_CERTIFICATE_ARN")
            [ -z "$TF_DOMAIN_NAME" ] && missing+=("TF_DOMAIN_NAME")
          fi

          if [ ${#missing[@]} -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Missing required apply inputs: ${missing[*]} — blocking terraform apply."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
        working-directory: .

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        if: steps.gate.outputs.skip != 'true'

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        if: steps.gate.outputs.skip != 'true'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # FIFO queue with deploy-api-staging (shared staging-mutations group).
      - name: Queue staging mutation
        if: steps.gate.outputs.skip != 'true'
        uses: softprops/turnstyle@807f6009e7cee5c2c9faa41ccef03a8bb24b06ab # v2.1.0
        with:
          poll-interval-seconds: 20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        if: steps.gate.outputs.skip != 'true'
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false

      - name: Terraform init
        if: steps.gate.outputs.skip != 'true'
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"

      - name: Terraform apply
        if: steps.gate.outputs.skip != 'true'
        run: terraform apply -input=false -auto-approve
        env:
          TF_VAR_github_org: ${{ vars.TF_GITHUB_ORG || github.repository_owner }}
          TF_VAR_github_repo: ${{ vars.TF_GITHUB_REPO || github.event.repository.name }}
          TF_VAR_jwt_secret: ${{ secrets.TF_JWT_SECRET }}
          TF_VAR_cors_origin: ${{ vars.TF_CORS_ORIGIN || 'https://localhost:3000' }}
          TF_VAR_redis_auth_token: ${{ secrets.TF_REDIS_AUTH_TOKEN }}
          TF_VAR_enable_https: ${{ vars.TF_ENABLE_HTTPS || 'true' }}
          TF_VAR_certificate_arn: ${{ vars.TF_CERTIFICATE_ARN }}
          TF_VAR_domain_name: ${{ vars.TF_DOMAIN_NAME }}
          TF_VAR_tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_tf_lock_table: ${{ vars.TF_LOCK_TABLE }}
