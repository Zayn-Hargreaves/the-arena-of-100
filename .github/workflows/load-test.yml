name: Load Test (k6)

# Manual only — a full 100-VU load run is expensive and not something we
# want on every push. Trigger from the Actions tab (or `gh workflow run
# load-test.yml`) when you need fresh baseline numbers for the P2
# spectator-transport decision.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario file under load-test/scenarios/"
        type: choice
        default: full-match
        options:
          - smoke
          - full-match
          - spectator-flood
      players:
        description: "PLAYERS (player VUs)"
        default: "69"
      spectators:
        description: "SPECTATORS (spectator VUs)"
        default: "30"
      hold:
        description: "HOLD (steady-state duration, e.g. 4m)"
        default: "4m"

env:
  CI_DB_USER: arena_test
  CI_DB_PASSWORD: arena_test
  CI_DB_NAME: arena_test
  K6_VERSION: v0.54.0

jobs:
  load-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arena_test
          POSTGRES_PASSWORD: arena_test
          POSTGRES_DB: arena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://arena_test:arena_test@localhost:5432/arena_test
      REDIS_URL: redis://localhost:6379/2
      JWT_SECRET: ci-load-test-secret-key
      NODE_ENV: test
      PORT: "3001"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ac6db6d3c1f721f886538a378a2d73e85697340a
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Push schema
        run: pnpm --filter @arena/api exec prisma db push

      - name: Seed questions (required for the match loop)
        run: pnpm --filter @arena/api prisma:seed:dev

      - name: Build API
        run: pnpm --filter @arena/api build

      - name: Start API
        run: |
          nohup node apps/api/dist/main > api.log 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -sf --max-time 1 http://localhost:3001/api/v1/health > /dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"; cat api.log; exit 1

      - name: Install k6
        run: |
          echo "c7f03434854f837b6790ee81572e4b0f955241974c79a43cbb9f8d0fef069589  k6.tar.gz" > k6.sha256
          curl -fsSL "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" -o k6.tar.gz
          sha256sum -c k6.sha256
          tar xzf k6.tar.gz
          sudo cp k6-*/k6 /usr/local/bin/k6
          k6 version

      - name: Resolve run metadata
        id: meta
        run: |
          SCENARIO="${{ inputs.scenario }}"
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          COMMIT="${GITHUB_SHA::7}"
          OUT_NAME="${SCENARIO}-${COMMIT}-${TS}"
          echo "out_name=${OUT_NAME}" >> "$GITHUB_OUTPUT"
          echo "ts=${TS}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "scenario=${SCENARIO}" >> "$GITHUB_OUTPUT"

      - name: Start readiness coordinator
        env:
          REDIS_URL: redis://localhost:6379/2
          COORDINATOR_PORT: "7171"
        run: |
          nohup node load-test/scripts/coordinator.mjs > coordinator.log 2>&1 &
          echo "COORDINATOR_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:7171/healthz > /dev/null; then
              echo "Coordinator is up"; exit 0
            fi
            sleep 0.5
          done
          cat coordinator.log; exit 1

      - name: Start monitoring sampler (background)
        env:
          API_URL: http://localhost:3001
          REDIS_URL: redis://localhost:6379/2
          JWT_SECRET: ci-load-test-secret-key
          OUT_DIR: load-test/results
          OUT_NAME: ${{ steps.meta.outputs.out_name }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          mkdir -p load-test/results
          # Add a generous window on top of HOLD so the sampler
          # covers ramp + steady-state + cleanup.
          HOLD="${{ inputs.hold }}"; \
          RAMP="${{ inputs.RAMP_UP || '30s' }}"; \
          to_sec() { case "$1" in *s) echo "${1%s}";;
                                     *m) echo "$((${1%m}*60))";;
                                     *h) echo "$((${1%h}*3600))";;
                                     *)  echo "$1";; esac; }; \
          TOTAL=$(($(to_sec "$HOLD") + $(to_sec "$RAMP") + 120)); \
          echo "Sampler duration=${TOTAL}s"; \
          nohup node load-test/scripts/sample-monitoring.mjs \
            --scenario "$SCENARIO" \
            --duration "${TOTAL}s" \
            --api-url "$API_URL" \
            --jwt-secret "$JWT_SECRET" \
            --admin-username admin \
            --redis-url "$REDIS_URL" \
            --out-dir "$OUT_DIR" \
            --out-name "$OUT_NAME" \
            --anchor cleanup_window_end \
            > sampler.log 2>&1 &
          echo "SAMPLER_PID=$!" >> "$GITHUB_ENV"
          sleep 2
          # Quick liveness probe so a dead sampler fails the step
          # instead of silently skewing CPU/RSS/Redis numbers.
          if ! kill -0 "$SAMPLER_PID" 2>/dev/null; then
            echo "Sampler died at start"; cat sampler.log; exit 1
          fi

      - name: Run k6 (${{ inputs.scenario }})
        env:
          PLAYERS: ${{ inputs.players }}
          SPECTATORS: ${{ inputs.spectators }}
          HOLD: ${{ inputs.hold }}
          COORDINATOR_URL: http://127.0.0.1:7171
          READINESS_RUN_ID: ${{ steps.meta.outputs.scenario }}-${{ steps.meta.outputs.ts }}
        run: |
          k6 run \
            -e API_URL=http://localhost:3001 \
            -e PLAYERS="$PLAYERS" \
            -e SPECTATORS="$SPECTATORS" \
            -e HOLD="$HOLD" \
            -e COORDINATOR_URL="$COORDINATOR_URL" \
            -e READINESS_RUN_ID="$READINESS_RUN_ID" \
            --summary-export=load-test/results/${{ steps.meta.outputs.out_name }}.k6.json \
            load-test/scenarios/${{ inputs.scenario }}.js

      - name: Stop monitoring sampler
        if: always()
        run: |
          if [ -n "${SAMPLER_PID:-}" ] && kill -0 "$SAMPLER_PID" 2>/dev/null; then
            kill -TERM "$SAMPLER_PID" 2>/dev/null || true
            # Give the sampler up to 15s to flush JSONL streams
            # cleanly. If it does not exit, force-kill but do not
            # fail the workflow — the artifacts below are uploaded
            # regardless.
            for _ in $(seq 1 30); do
              kill -0 "$SAMPLER_PID" 2>/dev/null || break
              sleep 0.5
            done
            kill -KILL "$SAMPLER_PID" 2>/dev/null || true
            wait "$SAMPLER_PID" 2>/dev/null || true
          fi
          # The sampler may have written a partial final line; make
          # sure every JSONL row parses so the validator never sees a
          # broken trailing line.
          for f in load-test/results/${{ steps.meta.outputs.out_name }}.{cpu,redis}.jsonl; do
            [ -f "$f" ] || continue
            node -e "
              const fs=require('fs');
              const lines=fs.readFileSync(process.argv[1],'utf8').split('\n');
              const out=[];
              for (const l of lines) {
                if (!l.trim()) continue;
                try { JSON.parse(l); out.push(l); }
                catch (_) { /* drop broken trailing line */ }
              }
              fs.writeFileSync(process.argv[1], out.join('\n') + (out.length?'\n':''));
            " "$f" || true
          done

      - name: Write manifest
        if: always()
        env:
          OUT_NAME: ${{ steps.meta.outputs.out_name }}
          SCENARIO: ${{ inputs.scenario }}
          HOLD: ${{ inputs.hold }}
          PLAYERS: ${{ inputs.players }}
          SPECTATORS: ${{ inputs.spectators }}
        run: |
          node - <<NODE
          const fs = require('fs');
          const path = require('path');
          const outName = process.env.OUT_NAME;
          const dir = 'load-test/results';
          // Parse a duration string in the same shapes k6 accepts:
          //   240  -> 240 (seconds)
          //   240s -> 240
          //   4m   -> 240
          //   1h   -> 3600
          // Returns seconds. Default 240s, clamped later to >=30s.
          function parseDurationSec(raw, fallback) {
            if (raw == null) return fallback;
            const s = String(raw).trim();
            if (!s) return fallback;
            const m = s.match(/^(\d+)(s|m|h)?$/);
            if (!m) return fallback;
            const n = parseInt(m[1], 10);
            const unit = m[2] || 's';
            if (unit === 's') return n;
            if (unit === 'm') return n * 60;
            if (unit === 'h') return n * 3600;
            return n;
          }
          const holdSec = parseDurationSec(process.env.HOLD, 240);
          // HOLD_MIN: max(30s, parsed)
          const holdMin = Math.max(30, holdSec);
          // Expected match:state:* keys per scenario.
          const expected =
            process.env.SCENARIO === 'smoke' ? 0 : 1;
          const manifest = {
            name: outName,
            scenario: process.env.SCENARIO,
            thresholds: {
              errorRateMax: 0.01,
              latencyP95Ms: 1000,
              latencyP99Ms: 2500,
              disconnectMax: 0.01,
              cpuPeakMax: 80,
              cpuP95Max: 70,
              rssPeakMaxMb: 500,
              rssDeltaMaxMb: 50,
              redisMemDeltaMaxPct: 10,
            },
            steadyState: {
              holdMinSeconds: holdMin,
              startTs: null,
              endTs: null,
            },
            expectedRedisKeys: expected,
            k6Summary: path.join(dir, outName + '.k6.json'),
            cpuJsonl: path.join(dir, outName + '.cpu.jsonl'),
            redisJsonl: path.join(dir, outName + '.redis.jsonl'),
            anchorJson: path.join(dir, outName + '.anchor.json'),
            readiness: { ready: false, size: 0, target: 1 + Number(process.env.PLAYERS) + Number(process.env.SPECTATORS) },
          };
          fs.writeFileSync(path.join(dir, outName + '.manifest.json'), JSON.stringify(manifest, null, 2));
          NODE

      - name: Validate results
        if: always()
        env:
          OUT_NAME: ${{ steps.meta.outputs.out_name }}
        run: |
          node load-test/scripts/validate-results.mjs \
            --manifest "load-test/results/${OUT_NAME}.manifest.json" \
            --out-dir load-test/results || true

      - name: Upload results + API log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: load-test-${{ inputs.scenario }}-${{ steps.meta.outputs.commit }}
          path: |
            load-test/results/
            api.log
            coordinator.log

      - name: Stop coordinator
        if: always()
        run: kill "${COORDINATOR_PID}" 2>/dev/null || true

      - name: Stop API
        if: always()
        run: kill "${API_PID}" 2>/dev/null || true
