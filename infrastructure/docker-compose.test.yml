# ============================================================
# Arena of 100 - Docker Compose (Test Environment)
# Isolated PostgreSQL instance for E2E tests.
# Runs on port 5434 to avoid clashing with the dev DB
# (which itself may be on 5432 or 5433 depending on the host).
# Volume is disposable: `pnpm test:db:down` wipes it.
# ============================================================

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: arena-postgres-test
    restart: "no"
    environment:
      POSTGRES_USER: arena_test
      POSTGRES_PASSWORD: arena_test
      POSTGRES_DB: arena_test
    ports:
      - "5434:5432"
    volumes:
      - pg_test_data:/var/lib/postgresql/data
      - ./scripts/postgres-init-test.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena_test -d arena_test"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pg_test_data:
    name: arena_pg_test_data
