# ============================================================
# Arena of 100 — sticky load balancer for the multi-instance topology
# (docker-compose.multi.yml). Fronts api1/api2/api3 on a single :8080
# origin. k6 and the web client point here.
#
# Balancing choice — least_conn (NOT ip_hash) for the load test:
#   The k6 client is WEBSOCKET-ONLY (lib/socketio.js forces
#   transport=websocket, no HTTP polling upgrade). A websocket-only
#   Engine.IO connection is a single long-lived TCP connection with one
#   upgrade, so it is inherently pinned to whichever node accepts it —
#   no second polling request needs to return to the same node. That
#   makes per-connection stickiness automatic, so we can use least_conn
#   to SPREAD the ~100 sockets across all nodes. Spreading is the whole
#   point: it puts members of the same room on different nodes, which is
#   exactly what exercises the Redis adapter fan-out and gives the
#   node-kill failover test a meaningful blast radius.
#
#   ip_hash would pin every k6 VU (all from one host IP) to a single
#   backend — defeating the cross-node test. ip_hash is the correct
#   choice for real BROWSERS (distinct IPs, polling->upgrade needs
#   affinity); see docs/architecture-distributed.md.
# ============================================================

worker_processes auto;
events { worker_connections 4096; }

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream arena_api {
    # Balancing method is injected by envsubst from the LB_METHOD env var
    # (see the nginx service in docker-compose.multi.yml). Default
    # `least_conn` for the websocket-only k6 load test (spreads sockets
    # across nodes); set `LB_METHOD=ip_hash` for browser/polling traffic
    # that needs session affinity. Only $LB_METHOD is substituted, so
    # nginx's own $-variables below are left intact.
    ${LB_METHOD};
    server api1:3001 max_fails=2 fail_timeout=5s;
    server api2:3001 max_fails=2 fail_timeout=5s;
    server api3:3001 max_fails=2 fail_timeout=5s;
    keepalive 64;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://arena_api;
      proxy_http_version 1.1;

      # WebSocket upgrade — mandatory for the Socket.IO transport.
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Long-lived sockets: don't cull an idle-ish WS during a 4-min hold.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;

      # When a node dies (chaos test), let a NEW connection reroute to a
      # live node. Existing sockets on the dead node still drop and must
      # reconnect — that reconnect is exactly the failover we measure.
      proxy_next_upstream error timeout http_502 http_503;
    }
  }
}
