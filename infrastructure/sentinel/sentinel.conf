# ============================================================
# Arena of 100 - Redis Sentinel Configuration
# ============================================================

port 26379
dir /tmp

# Resolve hostnames for Docker container discovery
sentinel resolve-hostnames yes

# Monitor master group 'mymaster' at redis-master:6379 with quorum 2
sentinel monitor mymaster redis-master 6379 2

# Master considered down after 5000ms (5 seconds) of unreachability
sentinel down-after-milliseconds mymaster 5000

# Failover timeout: 10000ms (10 seconds)
sentinel failover-timeout mymaster 10000

# Number of replicas reconfigured in parallel after failover
sentinel parallel-syncs mymaster 1
