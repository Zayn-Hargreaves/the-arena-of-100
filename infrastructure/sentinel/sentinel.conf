# ============================================================
# Arena of 100 - Redis Sentinel Configuration (seed template)
# ============================================================
# Copied into the Sentinel data volume only on first start.
# Sentinel rewrites this file after failover (current master, etc.).
# To re-apply seed changes, remove the redis_sentinel*_data volumes.
# ============================================================

port 26379
dir /data

# Resolve Docker DNS names (redis-master, redis-replica-*, etc.)
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# Initial monitor target for cold start (quorum = 2 of 3)
sentinel monitor mymaster redis-master 6379 2

sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 10000
sentinel parallel-syncs mymaster 1
